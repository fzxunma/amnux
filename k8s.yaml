kind: Service
apiVersion: v1
metadata:
  name: amnux
  namespace: tdd-test
spec:
  type: NodePort
  selector:
    app: amnux
  ports:
  - name: port-80
    port: 80
    targetPort: 10011
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: amnux
  labels:
    app: amnux
  namespace: tdd-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amnux
  template:
    metadata:
      labels:
        app: amnux
    spec:
      containers:
      - name: amnux
        image: harbor.zncode.com/tdd-test/amnux:1.0.0
        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 2500Mi
            cpu: 500m
        imagePullPolicy: Always
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
      - name: tdd-test